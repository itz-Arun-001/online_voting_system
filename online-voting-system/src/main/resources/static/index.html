    .vh-split-auth {
      flex-direction: column;
      max-width: 480px;
    }

      padding: 24px;
    }
    .vh-auth-quote {
      margin-top: 20px;
      font-size: 22px;
    }
    .vh-auth-quote span {
      font-size: 17px;
    }
    .vh-auth-form-card {
      padding: 32px 24px;
    }

</head>
<body>

<div class="vh-split-auth">
  <!-- Visual Left Column with High-Resolution College Image -->
  <div class="vh-auth-visual">
    <div class="vh-auth-overlay"></div>
    <div class="vh-auth-visual-content">
      <a class="vh-brand-white" href="/">
        <span class="vh-brand-logo" style="background-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.25);"></span>
        CampusVote
      </a>
      <div class="vh-auth-quote">
        A Better Campus Together
        <span>Be a Part of the Change</span>
      </div>
    </div>
    <div class="vh-auth-tagline">
      Official Student Government Online Voting System
    </div>
  </div>

  <!-- Form Right Column -->
  <div class="vh-auth-form-card">
    <div class="vh-role-pills" style="margin-bottom:20px;">
      <div class="vh-role-pill active" style="width:100%;text-align:center;">Student &amp; Admin Sign In</div>
    </div>

    <h2 style="font-size:24px;margin:0 0 6px;color:var(--ink);">Welcome Back</h2>
    <p style="font-size:14px;color:var(--muted);margin:0 0 20px;">Enter your college email address to receive a secure one-time passcode.</p>

    <div id="msg"></div>

    <!-- Step 1: Email Form -->
    <form id="emailForm">
      <label for="email" style="font-size:13px;font-weight:600;">College Email / Register Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@student.annauniv.edu" required style="border-radius:8px;padding:12px 14px;margin-bottom:8px;">
      <p class="hint" id="domainHint" style="font-size:12px;margin-bottom:20px;">Sign in with your registered college email address.</p>
      <button class="vh-submit-vote-btn" id="sendBtn" style="max-width:100%;margin:0;border-radius:8px;width:100%;">Send Verification Code →</button>
    </form>

    <!-- Step 2: OTP Form -->
    <form id="otpForm" hidden>
      <p id="sentTo" style="font-size:13px;color:var(--muted);background:var(--faint);padding:10px 12px;border-radius:8px;border:1px solid var(--vh-border);margin-bottom:16px;"></p>
      <label for="otp" style="font-size:13px;font-weight:600;">6-Digit Verification Code</label>
      <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required style="border-radius:8px;padding:12px 14px;letter-spacing:0.35em;text-align:center;font-size:22px;margin-bottom:16px;">
      
      <button class="vh-submit-vote-btn" id="verifyBtn" style="max-width:100%;margin:0 0 12px;border-radius:8px;width:100%;">Verify and Sign In</button>
      
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:8px;">
        <button type="button" class="btn link" id="resend" style="padding:0;font-size:13px;">Resend code</button>
        <button type="button" class="btn link" id="change" style="padding:0;font-size:13px;">Use a different email</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const isAdm = (r) => r === 'ADMIN' || r === 'CO_ADMIN';
if (sessionStorage.getItem('token')) location.replace(isAdm(sessionStorage.getItem('role')) ? 'admin.html' : 'vote.html');

fetch('/api/public/config').then((r) => r.json()).then((c) => {
  if (c.hint) {
    $('#domainHint').textContent = 'Accepted domains: ' + c.hint + ' (or authorized admin emails)';
  }
  if (c.collegeDomain) {
    $('#email').placeholder = 'name@' + c.collegeDomain;
  }
}).catch(() => {});

async function sendCode() {
  const email = $('#email').value.trim();
  $('#sendBtn').disabled = true;
  try {
    const r = await api('/auth/request-otp', { method: 'POST', body: { email } });
    notify($('#msg'), r.message);
    $('#sentTo').textContent = 'Enter the 6-digit code sent to ' + email.toLowerCase() + '. It expires in 5 minutes.';
    $('#emailForm').hidden = true; $('#otpForm').hidden = false; $('#otp').focus();
  } catch (e) { notify($('#msg'), e.message, 'err'); }
  $('#sendBtn').disabled = false;
}
$('#emailForm').addEventListener('submit', (e) => { e.preventDefault(); sendCode(); });
$('#resend').onclick = () => sendCode();
$('#change').onclick = () => { $('#otpForm').hidden = true; $('#emailForm').hidden = false; notify($('#msg'), ''); $('#email').focus(); };

$('#otpForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#verifyBtn').disabled = true;
  try {
    const r = await api('/auth/verify-otp', { method: 'POST', body: { email: $('#email').value.trim(), otp: $('#otp').value.trim() } });
    sessionStorage.setItem('token', r.token);
    sessionStorage.setItem('role', r.role);
    sessionStorage.setItem('email', r.email);
    location.href = isAdm(r.role) ? 'admin.html' : 'vote.html';
  } catch (err) { notify($('#msg'), err.message, 'err'); $('#otp').select(); }
  $('#verifyBtn').disabled = false;
});
</script>
</body>
</html>
