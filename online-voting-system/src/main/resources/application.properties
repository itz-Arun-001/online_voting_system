spring.application.name=online-voting-system
# Optional local settings file: copy .env.example to .env (it is git-ignored) and fill in SMTP_* to send real emails.
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ---- Election settings ----
app.college-domain=${COLLEGE_DOMAIN:yourcollege.edu}
app.admin-emails=${ADMIN_EMAILS:admin@yourcollege.edu}
app.cors-origins=${CORS_ORIGINS:}
app.display-zone=${DISPLAY_ZONE:Asia/Kolkata}
app.mail-from=${MAIL_FROM:${SMTP_USER:no-reply@voting.local}}
app.brevo-api-key=${BREVO_API_KEY:}
app.resend-api-key=${RESEND_API_KEY:}
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.length=6
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}
app.rate-limit.otp-requests=3
app.rate-limit.otp-ip-requests=60
app.rate-limit.verify-ip-attempts=120
app.rate-limit.window-minutes=10

# ---- Mail (leave SMTP_HOST empty in dev: the OTP is printed in the console) ----
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
